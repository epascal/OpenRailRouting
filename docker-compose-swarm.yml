version: '3.8'

services:
  openrailrouting:
    image: openrailrouting_openrailrouting:latest
    ports:
      - "8991:8991"
      - "8992:8992"
    volumes:
      - openrailrouting-data:/data
      - openrailrouting-cache:/graph-cache
    environment:
      - JAVA_OPTS=-Ddw.graphhopper.datareader.file=/data/france-switzerland.osm.pbf
    command:
      - java
      - -Xmx2500m
      - -Xms50m
      - -Ddw.graphhopper.datareader.file=/data/france-switzerland.osm.pbf
      - -Ddw.graphhopper.graph.location=/graph-cache
      - -jar
      - app.jar
      - server
      - config.yml
    # config.yml is served from a swarm config (not the image bake) so
    # config-docker.yml edits apply without rebuilding the image.
    # NOTE: prepare.min_network_size cannot be set via -Ddw.* (rejected by
    # RailwayRoutingServerConfiguration) — it must live in the config file.
    configs:
      - source: orr-config
        target: /app/config.yml

volumes:
  openrailrouting-data:
  openrailrouting-cache:

configs:
  orr-config:
    file: ./config-docker.yml

version: '3.8'

services:
  openrailrouting:
    build: .
    ports:
      - "8991:8991"
      - "8992:8992"
    volumes:
      - ./data:/data
      - ./graph-cache:/graph-cache
    environment:
      - JAVA_OPTS=-Ddw.graphhopper.datareader.file=/data/france-switzerland.osm.pbf
    command: >
      java -Xmx2500m -Xms50m 
      -Ddw.graphhopper.datareader.file=/data/france-switzerland.osm.pbf 
      -Ddw.graphhopper.graph.location=/graph-cache 
      -jar app.jar server config.yml
